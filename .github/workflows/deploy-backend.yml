name: CI/CD Backend

# 실행 조건
# - feature/dev/main push 또는 main/dev 대상 PR에서는 ci job만 실행됨
# - main push 또는 main에서 수동 실행(workflow_dispatch)일 때만 image-push/deploy까지 실행됨
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  ci:
    # GitHub에서 제공하는 Ubuntu runner에서 빌드 실행
    runs-on: ubuntu-latest

    steps:
      # 저장소 전체 코드를 runner로 가져옴
      # CI 단계는 Gradle 빌드를 해야 하므로 src, build.gradle, gradlew 등이 필요함
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 21 JDK 설치
      # distribution: temurin은 Dockerfile의 eclipse-temurin 계열과 맞추기 위한 선택
      # cache: gradle은 Gradle 의존성 캐시를 재사용해서 빌드 속도를 개선함
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Linux runner에서 gradlew를 실행할 수 있도록 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 코드 추가 후 활성화
      # - name: Run tests
      #   run: ./gradlew test --no-daemon

      # Spring Boot 실행 JAR 생성
      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon

      # 디버깅용: 실제 JAR가 생성되었는지 확인
      - name: Check build output
        run: ls -lh build/libs

      # 다음 image-push job에서 JAR를 사용할 수 있도록 artifact로 업로드
      # retention-days: 3은 artifact를 3일만 보관해서 불필요한 저장 공간 사용을 줄임
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 3

  image-push:
    # ci가 성공해야 이미지 빌드/푸시 진행
    needs: ci
    # main push 또는 main에서 수동 실행할 때만 Registry에 이미지 push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # 이미지 빌드에는 전체 소스가 필요 없음
      # 현재 Dockerfile은 app.jar만 COPY하므로 Dockerfile만 checkout
      - name: Checkout Dockerfile only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false

      # ci job에서 만든 JAR artifact 다운로드
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      # Dockerfile이 COPY app.jar를 사용하므로 파일명을 app.jar로 맞춤
      - name: Rename JAR
        run: mv *.jar app.jar

      # 자체 구축한 Private Registry에 로그인
      # REGISTRY_PASSWORD는 파일에 저장하지 않고 stdin으로만 전달
      - name: Login to private registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} \
            -u "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      # Docker 이미지 빌드
      # - github.sha: 불변에 가까운 배포 추적용 태그
      # - latest: 사람이 보기 쉬운 최신 버전 태그
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }} .
          docker tag ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }} \
            ${{ secrets.REGISTRY_URL }}/side-project-backend:latest

      # Private Registry에 이미지 push
      - name: Push Docker image
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/side-project-backend:latest

  deploy:
    # 이미지 push가 성공해야 EC2 배포 진행
    needs: image-push
    # main push 또는 main에서 수동 실행할 때만 배포
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # EC2 배포에는 docker-compose와 nginx 설정만 필요
      # 소스코드 전체를 EC2에 보낼 필요 없음
      - name: Checkout deploy files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            nginx/
          sparse-checkout-cone-mode: false

      # EC2 SSH 접속 준비
      # EC2_SSH_KEY는 GitHub Secrets에 저장된 pem private key
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # EC2에 배포용 파일 업로드
      # .env는 민감정보가 있으므로 GitHub에서 보내지 않고 EC2에 기존 파일을 유지함
      - name: Upload deploy files
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /opt/side-project/nginx"

          scp -i ~/.ssh/ec2_key.pem docker-compose.prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/side-project/docker-compose.prod.yml

          scp -i ~/.ssh/ec2_key.pem nginx/nginx.blue.conf nginx/nginx.green.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/side-project/nginx/

      # EC2에서 Blue/Green 배포 수행
      - name: Blue/Green deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' << 'EOF'
            # 에러 발생 시 즉시 중단
            # -e: 실패 시 종료, -u: 정의 안 된 변수 사용 금지, -o pipefail: pipe 중간 실패 감지
            set -Eeuo pipefail

            APP_DIR=/opt/side-project
            IMAGE_TAG="${{ github.sha }}"
            REGISTRY_URL="${{ secrets.REGISTRY_URL }}"
            REGISTRY_USERNAME="${{ secrets.REGISTRY_USERNAME }}"
            REGISTRY_PASSWORD="${{ secrets.REGISTRY_PASSWORD }}"

            cd "$APP_DIR"
            mkdir -p nginx

            # deploy.env는 앱 설정 파일이 아니라 배포 상태 저장 파일
            # 예: ACTIVE_COLOR, BLUE_IMAGE_TAG, GREEN_IMAGE_TAG, NGINX_HOST_PORT
            # DB 비밀번호/JWT_SECRET 같은 앱 민감정보는 .env에만 둠
            touch deploy.env

            # deploy.env에 key=value를 추가하거나 갱신하는 함수
            set_env() {
              local key="$1"
              local value="$2"

              if grep -q "^${key}=" deploy.env; then
                sed -i "s|^${key}=.*|${key}=${value}|" deploy.env
              else
                echo "${key}=${value}" >> deploy.env
              fi
            }

            # docker compose 실행 시 deploy.env를 함께 읽도록 공통 함수화
            compose() {
              docker compose --env-file deploy.env -f docker-compose.prod.yml "$@"
            }

            # compose에서 이미지 주소와 nginx host port를 사용할 수 있도록 저장
            set_env REGISTRY_URL "$REGISTRY_URL"
            set_env NGINX_HOST_PORT "8080"

            # 현재 active color를 deploy.env에서 읽음
            CURRENT="$(grep -E '^ACTIVE_COLOR=' deploy.env | cut -d '=' -f 2 || true)"

            # deploy.env가 없거나 값이 이상한 경우 nginx.conf 내용을 보고 한 번 더 추론
            if [ "$CURRENT" != "blue" ] && [ "$CURRENT" != "green" ]; then
              if [ -f nginx/nginx.conf ] && grep -q "side-project-backend-blue" nginx/nginx.conf; then
                CURRENT="blue"
              elif [ -f nginx/nginx.conf ] && grep -q "side-project-backend-green" nginx/nginx.conf; then
                CURRENT="green"
              else
                CURRENT="none"
              fi
            fi

            # 현재 blue가 서비스 중이면 green에 새 버전 배포
            # 현재 green이 서비스 중이면 blue에 새 버전 배포
            # 첫 배포라면 blue부터 사용
            if [ "$CURRENT" = "blue" ]; then
              TARGET="green"
            else
              TARGET="blue"
            fi

            # 이번에 배포할 color에만 새 이미지 태그를 반영
            # 반대 color의 태그는 유지되므로 수동 rollback에 사용할 수 있음
            if [ "$TARGET" = "blue" ]; then
              set_env BLUE_IMAGE_TAG "$IMAGE_TAG"
            else
              set_env GREEN_IMAGE_TAG "$IMAGE_TAG"
            fi

            # EC2에서 Private Registry에 로그인한 뒤 image pull 가능하게 함
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" \
              -u "$REGISTRY_USERNAME" \
              --password-stdin

            echo "Current active color: $CURRENT"
            echo "Deploy target color: $TARGET"
            echo "Deploy image tag: $IMAGE_TAG"

            # 새 target color의 이미지를 pull하고 컨테이너 실행
            compose pull "backend-$TARGET"
            compose up -d "backend-$TARGET"

            # 트래픽 전환 전, 새 컨테이너 내부에서 Spring health check 확인
            echo "Checking backend-$TARGET health..."
            HEALTH_OK="false"
            for i in $(seq 1 30); do
              if docker exec "side-project-backend-$TARGET" sh -c 'curl -fsS "http://localhost:8080${SERVER_SERVLET_CONTEXT_PATH:-/api}/health" >/dev/null'; then
                HEALTH_OK="true"
                break
              fi
              sleep 3
            done

            # health check 실패 시 새 컨테이너만 제거하고 기존 서비스는 유지
            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed. Removing new $TARGET container."
              compose logs --tail=100 "backend-$TARGET" || true
              compose stop "backend-$TARGET" || true
              compose rm -f "backend-$TARGET" || true
              exit 1
            fi

            # 기존 단일 컨테이너 배포에서 blue/green으로 최초 전환할 때의 처리
            # 기존 side-project-backend가 8080을 사용 중이면 nginx-proxy가 8080을 쓸 수 없으므로 중지
            LEGACY_BACKEND_WAS_RUNNING="false"
            if docker ps --format '{{.Names}}' | grep -qx "side-project-backend"; then
              echo "Stopping legacy single backend container to free port 8080..."
              LEGACY_BACKEND_WAS_RUNNING="true"
              docker stop side-project-backend
            fi

            # nginx 설정 파일을 target color용으로 교체해서 트래픽 전환
            echo "Switching Nginx traffic to $TARGET..."
            cp "nginx/nginx.$TARGET.conf" nginx/nginx.conf
            compose up -d nginx-proxy
            docker exec side-project-nginx-proxy nginx -t
            docker exec side-project-nginx-proxy nginx -s reload || compose restart nginx-proxy

            # nginx를 거친 전체 경로 health check
            NGINX_PORT="$(grep -E '^NGINX_HOST_PORT=' deploy.env | cut -d '=' -f 2 || true)"
            NGINX_PORT="${NGINX_PORT:-8080}"

            echo "Checking Nginx routed health..."
            ROUTE_OK="false"
            for i in $(seq 1 10); do
              if curl -fsS "http://localhost:${NGINX_PORT}/api/health" >/dev/null; then
                ROUTE_OK="true"
                break
              fi
              sleep 2
            done

            # nginx 전환 후 문제가 생긴 경우 기존 color로 트래픽 복구
            if [ "$ROUTE_OK" != "true" ]; then
              echo "Traffic switch check failed."

              if [ "$CURRENT" = "blue" ] || [ "$CURRENT" = "green" ]; then
                echo "Rolling traffic back to $CURRENT..."
                cp "nginx/nginx.$CURRENT.conf" nginx/nginx.conf
                docker exec side-project-nginx-proxy nginx -s reload || compose restart nginx-proxy
                set_env ACTIVE_COLOR "$CURRENT"
              fi

              compose stop "backend-$TARGET" || true

              # 최초 blue/green 전환 중 실패했다면 기존 단일 컨테이너를 다시 시작
              if [ "$LEGACY_BACKEND_WAS_RUNNING" = "true" ]; then
                echo "Restoring legacy single backend container..."
                compose stop nginx-proxy || true
                docker start side-project-backend || true
              fi

              exit 1
            fi

            # 최종 성공한 경우 active color 저장
            set_env ACTIVE_COLOR "$TARGET"

            echo "Deployment completed. Active color: $TARGET"

            # dangling image만 정리. rollback용 이전 이미지를 지울 수 있는 -a 옵션은 사용하지 않음
            docker image prune -f
          EOF
