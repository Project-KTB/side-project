name: CI/CD Backend

# 실행 조건
# - feature/dev/main push 또는 main/dev 대상 PR에서는 ci job만 실행됨
# - main push 또는 main에서 수동 실행(workflow_dispatch)일 때만 image-push/deploy까지 실행됨
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# 현재 백엔드 저장소의 기본 GITHUB_TOKEN은 코드 읽기만 허용합니다.
permissions:
  contents: read

jobs:
  ci:
    # GitHub에서 제공하는 Ubuntu runner에서 빌드 실행
    runs-on: ubuntu-latest

    steps:
      # 저장소 전체 코드를 runner로 가져옴
      # CI 단계는 Gradle 빌드를 해야 하므로 src, build.gradle, gradlew 등이 필요함
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 21 JDK 설치
      # distribution: temurin은 Dockerfile의 eclipse-temurin 계열과 맞추기 위한 선택
      # cache: gradle은 Gradle 의존성 캐시를 재사용해서 빌드 속도를 개선함
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Linux runner에서 gradlew를 실행할 수 있도록 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 코드 추가 후 활성화
      # - name: Run tests
      #   run: ./gradlew test --no-daemon

      # Spring Boot 실행 JAR 생성
      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon

      # 디버깅용: 실제 JAR가 생성되었는지 확인
      - name: Check build output
        run: ls -lh build/libs

      # 다음 image-push job에서 JAR를 사용할 수 있도록 artifact로 업로드
      # retention-days: 3은 artifact를 3일만 보관해서 불필요한 저장 공간 사용을 줄임
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 3

  image-push:
    # ci가 성공해야 이미지 빌드/푸시 진행
    needs: ci
    # main push 또는 main에서 수동 실행할 때만 Registry에 이미지 push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # 이미지 빌드에는 전체 소스가 필요 없음
      # 현재 Dockerfile은 app.jar만 COPY하므로 Dockerfile만 checkout
      - name: Checkout Dockerfile only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false

      # ci job에서 만든 JAR artifact 다운로드
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      # Dockerfile이 COPY app.jar를 사용하므로 파일명을 app.jar로 맞춤
      - name: Rename JAR
        run: mv *.jar app.jar

      # 자체 구축한 Private Registry에 로그인
      # REGISTRY_PASSWORD는 파일에 저장하지 않고 stdin으로만 전달
      - name: Login to private registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} \
            -u "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      # Docker 이미지 빌드
      # - github.sha: 불변에 가까운 배포 추적용 태그
      # - latest: 사람이 보기 쉬운 최신 버전 태그
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }} .
          docker tag ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }} \
            ${{ secrets.REGISTRY_URL }}/side-project-backend:latest

      # Private Registry에 이미지 push
      - name: Push Docker image
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/side-project-backend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/side-project-backend:latest

  update-gitops:
    # 이미지가 Registry에 성공적으로 Push된 후에만 GitOps 저장소를 변경합니다.
    needs: image-push

    # main Push 또는 main 브랜치에서 수동 실행할 때만 배포 태그를 변경합니다.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    steps:
      # 별도로 분리한 GitOps 저장소를 checkout합니다.
      # 기본 GITHUB_TOKEN은 현재 백엔드 저장소에만 권한이 있으므로
      # side-project-gitops 쓰기 권한을 가진 GITOPS_TOKEN을 사용합니다.
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Project-KTB/side-project-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      # values-prod.yaml의 image.tag를 이번 백엔드 커밋 SHA로 변경합니다.
      - name: Update backend image tag
        uses: mikefarah/yq@v4.53.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          cmd: >-
            yq -i
            '.image.tag = strenv(IMAGE_TAG)'
            gitops/charts/side-project-backend/values-prod.yaml

      # 의도한 필드만 변경됐는지 로그에서 확인합니다.
      - name: Verify GitOps change
        run: |
          git -C gitops diff -- \
            charts/side-project-backend/values-prod.yaml

      # 변경된 image.tag를 GitOps 저장소에 커밋하고 Push합니다.
      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/side-project-backend/values-prod.yaml

          if git diff --cached --quiet; then
            echo "Image tag is already ${IMAGE_TAG}. Nothing to commit."
            exit 0
          fi

          git commit -m "deploy: update backend image to ${IMAGE_TAG}"
          git push origin main      
