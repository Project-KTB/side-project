spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: side-project

  # DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/side_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # 카멜 케이스 컬럼명을 변환 없이 그대로 사용
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${HIBERNATE_USE_SQL_COMMENTS:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  image-url-prefix: ${FILE_IMAGE_URL_PREFIX:/uploads}

# JWT
jwt:
  secret: ${JWT_SECRET:Tm5KRFFUWTBTMWsyTkhWck5qVXlPRFkyWlVrMk5IVnJOMGxMY3pkS1YwVTNTalpSTjB4RGJ6ZE1iVEEzV1U5Qk4xbDVUVGRhVjFrPQ==}
  access-token-exp-seconds: ${JWT_ACCESS_TOKEN_EXP_SECONDS:60}
  refresh-token-exp-seconds: ${JWT_REFRESH_TOKEN_EXP_SECONDS:1209600}
