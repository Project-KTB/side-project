spring:
  application:
    name: side-project

  # DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/side_project
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # 카멜 케이스 컬럼명을 변환 없이 그대로 사용
    show-sql: true # 콘솔 창에 JPA가 만든 SQL 쿼리를 보여줌 (개발용)
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

