spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: side-project

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        use_sql_comments: ${HIBERNATE_USE_SQL_COMMENTS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:warn}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  auth:
    refresh-cookie:
      secure: ${APP_REFRESH_COOKIE_SECURE:true}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_REFRESH_COOKIE_DOMAIN:}
  image-upload:
    enabled: ${APP_IMAGE_UPLOAD_ENABLED:false}
  image-storage:
    type: ${APP_IMAGE_STORAGE_TYPE:local}
    s3:
      bucket: ${APP_IMAGE_STORAGE_S3_BUCKET:}
      region: ${APP_IMAGE_STORAGE_S3_REGION:ap-northeast-2}
      public-url-prefix: ${APP_IMAGE_STORAGE_S3_PUBLIC_URL_PREFIX:}
      presigned-url-duration-seconds: ${APP_IMAGE_STORAGE_S3_PRESIGNED_URL_DURATION_SECONDS:300}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  image-url-prefix: ${FILE_IMAGE_URL_PREFIX:/uploads}

refresh-token:
  hash-secret: ${REFRESH_TOKEN_HASH_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: ${JWT_ACCESS_TOKEN_EXP_SECONDS:300}
  refresh-token-exp-seconds: ${JWT_REFRESH_TOKEN_EXP_SECONDS:1209600}
