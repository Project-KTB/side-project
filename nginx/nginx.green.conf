# ALB가 X-Forwarded-Proto를 넘겨주면 그 값을 유지하고,
# 없으면 nginx가 받은 scheme(http)을 사용함
# HTTPS는 ALB에서 종료되고 EC2 내부는 HTTP로 들어오는 구조를 고려한 설정
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # 현재 설정 파일은 green 컨테이너로 모든 요청을 전달함
    # ALB -> nginx-proxy -> side-project-backend-green:8080
    location / {
        proxy_pass http://side-project-backend-green:8080;
        proxy_http_version 1.1;

        # Spring Boot가 원래 요청 정보를 알 수 있도록 proxy header 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
