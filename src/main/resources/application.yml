spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: side-project

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/side_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # 카멜 케이스 컬럼명을 변환 없이 그대로 사용
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${HIBERNATE_USE_SQL_COMMENTS:true}

server:
  port: ${SERVER_PORT:8080}


logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    refresh-cookie:
      secure: ${APP_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_REFRESH_COOKIE_DOMAIN:}
  image-upload:
    enabled: ${APP_IMAGE_UPLOAD_ENABLED:true}
  image-storage:
    type: ${APP_IMAGE_STORAGE_TYPE:local}
    s3:
      bucket: ${APP_IMAGE_STORAGE_S3_BUCKET:}
      region: ${APP_IMAGE_STORAGE_S3_REGION:ap-northeast-2}
      public-url-prefix: ${APP_IMAGE_STORAGE_S3_PUBLIC_URL_PREFIX:}
      presigned-url-duration-seconds: ${APP_IMAGE_STORAGE_S3_PRESIGNED_URL_DURATION_SECONDS:300}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  image-url-prefix: ${FILE_IMAGE_URL_PREFIX:/uploads}

